image: barichello/godot-ci:4.2.2

# NOTE: the `cd` command in each build stage is not necessary if your
# project.godot is at the repo root

stages:
  - export
  - deploy

variables:
  EXPORT_NAME: megabatar

linux:
  stage: export
  script:
    - mkdir -v -p build/linux
    - godot --headless --verbose --export-release "Linux/X11" ./build/linux/$EXPORT_NAME.x86_64
  artifacts:
    name: $EXPORT_NAME-$CI_JOB_NAME
    paths:
      - build/linux
  only:
    - master
      
windows:
  stage: export
  script:
    - mkdir -v -p build/windows
    - godot --headless --verbose --export-release "Windows Desktop" ./build/windows/$EXPORT_NAME.exe
  artifacts:
    name: $EXPORT_NAME-$CI_JOB_NAME
    paths:
      - build/windows
  only:
    - master

mac:
  stage: export
  script:
    - mkdir -v -p build/macosx
    - godot --headless --verbose --export-release "Mac OSX" ./build/macosx/$EXPORT_NAME.zip
  artifacts:
    name: $EXPORT_NAME-$CI_JOB_NAME
    paths:
      - build/macosx
  only:
    - master
      
web:
  stage: export
  script:
    - mkdir -v -p build/web
    - godot --headless --verbose --export-release "Web" ./build/web/index.html
  artifacts:
    name: $EXPORT_NAME-$CI_JOB_NAME
    paths:
      - build/web
  only:
    - master

